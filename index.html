        .btn-sidebar-toggle {

        body {

            font-family: 'Arial', sans-serif;
            margin: 40px auto;

            padding: 20px;

        .card-producto {

        .card-producto img {

            border-radius: 6px;
            margin-bottom: 10px;
        }

        .card-producto h4 {

        .card-producto p {

            background-color: #333;
        }
        .btn-secundario:hover {
            background-color: #555;
        }

        /* --- PANEL LATERAL Y OVERLAY --- */
        .sidebar-overlay {
          position: fixed;
          top: 0; left: 0; width: 100%; height: 100%;
          background: rgba(0,0,0,0.5);
          z-index: 1000;
          opacity: 0;
          visibility: hidden;
          transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .sidebar-overlay.active {
          opacity: 1;
          visibility: visible;
        }

        .sidebar-panel {
          position: fixed;
          top: 0;
          left: -300px;
          width: 280px;
          height: 100%;
          background-color: var(--bg-sidebar, #ffffff);
          color: var(--text-sidebar, #333333);
          z-index: 1001;
          box-shadow: 4px 0 15px rgba(0,0,0,0.3);
          transition: left 0.3s ease;
          display: flex;
          flex-direction: column;
        }
        .sidebar-panel.active {
          left: 0;
        }

        .sidebar-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 18px 20px;
          border-bottom: 1px solid rgba(0,0,0,0.1);
        }
        .sidebar-header h3 { margin: 0; font-size: 20px; }
        .btn-close {
          background: none; border: none; font-size: 28px;
          cursor: pointer; color: inherit;
        }

        .sidebar-content { padding: 20px; overflow-y: auto; }
        .sidebar-section h4 { margin-top: 0; font-size: 14px; text-transform: uppercase; color: #888; letter-spacing: 1px; }
        .sidebar-menu { list-style: none; padding: 0; margin: 15px 0; }
        .sidebar-menu li { margin-bottom: 12px; }
        .sidebar-menu a {
          text-decoration: none;
          color: inherit;
          font-weight: bold;
          font-size: 15px;
          display: block;
          padding: 8px 10px;
          border-radius: 6px;

        .theme-subtitle { font-size: 13px; color: #666; margin-bottom: 10px; }

        .btn-theme {

          border-radius: 6px;
          font-weight: bold;
          cursor: pointer;
          font-size: 13px;
          transition: opacity 0.2s;

        .theme-light { background-color: #f4f6f8; color: #333; border: 1px solid #ccc; }

        .theme-coffee { background-color: #4a2822; color: #d7ccc8; }

        /* --- TEMAS (Aplicados a HTML/BODY) --- */

       #btn-close-sidebar {

html:not(.theme-light) .card-producto h4 {
